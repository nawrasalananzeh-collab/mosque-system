```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي للاختبار</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, #020617);
    background-size:200% 200%;
    animation:bgMove 10s ease-in-out infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.back{
    position:fixed;
    top:15px;
    left:15px;
    padding:10px 18px;
    border-radius:999px;
    text-decoration:none;
    color:white;
    background:rgba(71,85,105,.35);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.1);
    transition:.3s;
}

.back:hover{
    transform:scale(1.05);
}

.container{
    width:90%;
    max-width:900px;
    margin:60px auto;
}

.card{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:35px;
    border:1px solid rgba(255,255,255,.08);
}

.title{
    text-align:center;
    font-size:32px;
    margin-bottom:25px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.box{
    background:rgba(255,255,255,.05);
    padding:15px;
    border-radius:15px;
}

.label{
    color:#93c5fd;
    font-size:14px;
    margin-bottom:5px;
}

.value{
    font-size:18px;
}

.actions{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:12px 22px;
    border-radius:999px;
    color:white;
    text-decoration:none;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.view{
    background:rgba(34,197,94,.3);
}

.edit{
    background:rgba(245,158,11,.3);
}

.delete{
    background:rgba(239,68,68,.3);
}

@media(max-width:700px){

.info{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<a href="/tests" class="back">⬅ رجوع</a>

<div class="container">

<div class="card">

<div class="title">
📊 الملف الشخصي للاختبار
</div>

<div class="info">

<div class="box">
<div class="label">اسم الطالب</div>
<div class="value">{{ test.student_name }}</div>
</div>

<div class="box">
<div class="label">نوع الاختبار</div>
<div class="value">{{ test.test_type }}</div>
</div>

<div class="box">
<div class="label">العلامة</div>
<div class="value">{{ test.score }}</div>
</div>

<div class="box">
<div class="label">التاريخ</div>
<div class="value">{{ test.date }}</div>
</div>

<div class="box" style="grid-column:1/-1;">
<div class="label">الملاحظات</div>
<div class="value">{{ test.notes }}</div>
</div>

</div>

<div class="actions">

{% if test.pdf_file %}
<a class="btn view"
href="/view_test_file/{{ test.pdf_file }}"
target="_blank">
📄 عرض ملف PDF
</a>
{% endif %}

<a class="btn edit"
href="/edit_test/{{ test.id }}">
✏ تعديل
</a>

<a class="btn delete"
href="/delete_test/{{ test.id }}"
onclick="return confirm('هل تريد حذف الاختبار؟')">
🗑 حذف
</a>

</div>

</div>

</div>

</body>
</html>
```
