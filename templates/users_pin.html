<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>PIN الحماية</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

/* 🌌 خلفية متحركة */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    overflow:hidden;
    background:#020617;
}

/* خلفية */
.bg{
    position:fixed;
    inset:-40%;
    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, transparent 60%);
    animation:moveBG 10s ease-in-out infinite;
    z-index:-2;
}

@keyframes moveBG{
    0%{transform:translate(0,0);}
    50%{transform:translate(50px,-40px);}
    100%{transform:translate(0,0);}
}

/* 🧊 صندوق */
.box{
    width:340px;
    padding:25px;
    border-radius:18px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);

    box-shadow:0 25px 70px rgba(0,0,0,0.5);

    text-align:center;

    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

/* عنوان */
h2{
    margin-bottom:12px;
    font-size:20px;
}

/* input */
input{
    width:100%;
    padding:11px;
    margin-top:10px;

    border:none;
    border-radius:10px;
    outline:none;

    background:rgba(255,255,255,0.08);
    color:white;

    text-align:center;
    transition:0.3s;
}

input:focus{
    background:rgba(37,99,235,0.2);
    transform:scale(1.03);
}

/* زر الدخول */
button{
    width:100%;
    margin-top:10px;
    padding:11px;

    border:none;
    border-radius:10px;

    background:#2563eb;
    color:white;
    cursor:pointer;

    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

/* رجوع */
.back-btn{
    display:block;
    margin-top:12px;
    padding:10px;

    text-decoration:none;
    color:white;

    border-radius:10px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(12px);

    transition:0.3s;
}

.back-btn:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,0.12);
}

/* خطأ */
.error{
    color:#ff4d4d;
    margin-top:10px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="box">

    <h2>🔐 إدخال رمز الحماية</h2>

    <form method="POST">
        <input type="password" name="pin" placeholder="أدخل PIN">
        <button type="submit">دخول</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <a href="/dashboard" class="back-btn">⬅ الرجوع</a>

</div>

</body>
</html>
