<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الختمات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#050816;
    color:white;
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.title{
    font-size:32px;
    font-weight:800;
}

.add-btn{
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:12px;
    font-weight:700;
}

.table-box{
    background:rgba(255,255,255,.05);
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:rgba(37,99,235,.3);
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.08);
}

.btn{
    padding:8px 14px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-size:14px;
}

.view{
    background:#059669;
}

.delete{
    background:#dc2626;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:white;
    text-decoration:none;
}

</style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="title">🕋 الختمات</div>

        <a href="/add_khatma" class="add-btn">
            ➕ إضافة ختمة
        </a>
    </div>

    <div class="table-box">

        <table>

            <tr>
                <th>الطالب</th>
                <th>تاريخ الختمة</th>
                <th>الشيخ</th>
                <th>المسجد</th>
                <th>نوع الختمة</th>
                <th>الإجراءات</th>
            </tr>

            {% for k in khatmat %}
            <tr>

                <td>{{ k.student_name }}</td>
                <td>{{ k.khatma_date }}</td>
                <td>{{ k.sheikh_name }}</td>
                <td>{{ k.mosque_name }}</td>
                <td>{{ k.khatma_type }}</td>

                <td>

                    <a href="/khatma/{{ k.id }}" class="btn view">
                        عرض
                    </a>

                    <a href="/delete_khatma/{{ k.id }}" class="btn delete">
                        حذف
                    </a>

                </td>

            </tr>
            {% endfor %}

        </table>

    </div>

    <a href="/dashboard" class="back">
        ← العودة للواجهة الرئيسية
    </a>

</div>

</body>
</html>
