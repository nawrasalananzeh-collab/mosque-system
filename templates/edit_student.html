<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تعديل طالب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

/* 🌌 خلفية متحركة */
body{
    min-height:100vh;
    color:white;
    background:#020617;
    overflow-x:hidden;
}

/* خلفية طبقات */
.bg{
    position:fixed;
    inset:-40%;
    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, transparent 60%);
    animation:moveBG 12s ease-in-out infinite;
    z-index:-2;
}

@keyframes moveBG{
    0%{transform:translate(0,0);}
    50%{transform:translate(60px,-40px);}
    100%{transform:translate(0,0);}
}

/* 📌 الهيدر */
.header{
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

/* 📦 الحاوية */
.container{
    max-width:850px;
    margin:auto;
    padding:25px;
}

/* 🧊 الفورم */
form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

/* ✨ inputs زجاجية */
input{
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.06);
    color:white;
    outline:none;
    transition:0.3s;
    backdrop-filter:blur(10px);
}

/* Hover + Focus animation */
input:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,0.09);
}

input:focus{
    transform:translateY(-3px) scale(1.02);
    background:rgba(37,99,235,0.15);
    border-color:rgba(37,99,235,0.5);
}

/* 🔘 زر حفظ */
button{
    grid-column:span 2;
    padding:12px;
    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;

    transition:0.3s;
}

/* حركة الزر */
button:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 15px 30px rgba(245,158,11,0.3);
}

/* ⬅ زر الرجوع */
.back{
    position:fixed;
    top:15px;
    left:15px;

    padding:10px 15px;
    background:rgba(71,85,105,0.35);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;

    color:white;
    text-decoration:none;

    backdrop-filter:blur(12px);
    transition:0.3s;
}

.back:hover{
    transform:translateY(-2px);
    background:rgba(71,85,105,0.55);
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="header">
✏️ تعديل بيانات الطالب
</div>

<div class="container">

<form method="POST">

    <input type="text" name="name" value="{{ student.name }}" placeholder="الاسم">
    <input type="number" name="age" value="{{ student.age }}" placeholder="العمر">

    <input type="text" name="phone" value="{{ student.phone }}" placeholder="الهاتف">
    <input type="text" name="national_id" value="{{ student.national_id }}" placeholder="الرقم الوطني">

    <input type="text" name="sheikh_group" value="{{ student.sheikh_group }}" placeholder="مجموعة الشيخ">
    <input type="text" name="address" value="{{ student.address }}" placeholder="العنوان">

    <input type="text" name="parent_phone" value="{{ student.parent_phone }}" placeholder="رقم ولي الأمر">
    <input type="text" name="image" value="{{ student.image }}" placeholder="الصورة">

    <input type="number" name="juz_count" value="{{ student.juz_count }}" placeholder="عدد الأجزاء المحفوظة">
    <input type="number" name="umrah_count" value="{{ student.umrah_count }}" placeholder="عدد العمرات">

    <input type="text" name="umrah_dates"
           value="{{ student.umrah_dates }}"
           placeholder="تواريخ العمرات">

    <button type="submit">💾 حفظ التعديل</button>

</form>

</div>

<a href="/students" class="back">
⬅ الرجوع إلى صفحة عرض الطلبة
</a>

</body>
</html>
