<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تعديل الحافظ</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ===== الأساس ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:#050816;
    position:relative;
    overflow-x:hidden;
}

/* ===== خلفية داشبورد ===== */
body{
    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, #020617);

    background-size:200% 200%;
    animation:bgMove 10s ease-in-out infinite;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background: radial-gradient(circle at center, rgba(59,130,246,.18), transparent 70%);
    animation:pulseGlow 6s ease-in-out infinite;
    pointer-events:none;
    z-index:-1;
}

/* ===== animations ===== */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes pulseGlow{
    0%,100%{opacity:.4; transform:scale(1);}
    50%{opacity:.8; transform:scale(1.1);}
}

/* ===== الكرت ===== */
.container{
    width:45%;
    margin:70px auto;
    padding:35px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:25px;

    backdrop-filter:blur(20px);
    box-shadow:0 25px 60px rgba(0,0,0,.55);

    animation:floatBox 6s ease-in-out infinite;
}

@keyframes floatBox{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

/* ===== العنوان ===== */
h2{
    text-align:center;
    margin-bottom:25px;
    font-size:28px;
    color:#dbeafe;
}

/* ===== inputs ===== */
input{
    width:100%;
    padding:12px 14px;
    margin:10px 0;

    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);

    background:rgba(255,255,255,0.05);
    color:white;

    outline:none;
    transition:.3s;
    font-size:15px;
}

input:focus{
    border-color:rgba(59,130,246,0.6);
    box-shadow:0 0 15px rgba(59,130,246,.3);
    transform:translateY(-2px);
}

/* ===== زر الحفظ ===== */
button{
    width:100%;
    padding:12px;

    border-radius:999px;
    border:none;

    background:rgba(59,130,246,0.35);
    color:white;
    font-weight:bold;
    font-size:16px;

    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

button:hover{
    transform:translateY(-5px) scale(1.03);
    background:rgba(59,130,246,0.5);
    box-shadow:0 0 20px rgba(59,130,246,.4);
}

/* ===== زر رجوع ===== */
.back{
    position:fixed;
    top:15px;
    left:15px;

    padding:10px 16px;
    border-radius:999px;

    background:rgba(71,85,105,.35);
    color:white;
    text-decoration:none;

    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);

    transition:.3s;
}

.back:hover{
    transform:translateY(-3px) scale(1.05);
    background:rgba(71,85,105,.5);
}

</style>
</head>

<body>

<!-- رجوع -->
<a href="/hafaz" class="back">⬅ رجوع</a>

<div class="container">

<h2>✏ تعديل الحافظ لكتاب الله</h2>

<form method="POST">

    <input name="full_name" value="{{ hafaz.full_name }}" placeholder="اسم لبحافظ لكتاب الله">
    <input name="juz_count" value="{{ hafaz.juz_count }}" placeholder="عدد الأجزاء المحفوظه">
    <input name="sheikh" value="{{ hafaz.sheikh }}" placeholder="ختم لى يد الشيخ ">
    <input name="khatma_date" value="{{ hafaz.khatma_date }}" placeholder="تاريخ الختمة">
    <input name="khatma_place" value="{{ hafaz.khatma_place }}" placeholder="مكان الختمة">

    <button type="submit">💾 حفظ التعديل</button>

</form>

</div>

</body>
</html>
