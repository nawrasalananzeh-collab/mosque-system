<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الجلسات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    color:white;
    overflow-x:hidden;

    background:#050816;
}

/* 🌈 AURORA BACKGROUND */
.bg{
    position:fixed;
    inset:-50%;
    z-index:-2;

    background:
        radial-gradient(circle at 20% 20%, rgba(37,99,235,0.35), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(59,130,246,0.25), transparent 45%),
        radial-gradient(circle at 40% 80%, rgba(14,165,233,0.25), transparent 50%),
        radial-gradient(circle at 60% 60%, rgba(99,102,241,0.15), transparent 55%);

    filter: blur(40px);
    animation: moveBG 10s ease-in-out infinite;
}

/* حركة الخلفية */
@keyframes moveBG{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(40px,-30px) scale(1.1);}
    100%{transform:translate(0,0) scale(1);}
}

/* ✨ LIGHT GLOW LAYER */
.glow{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,0.05), transparent 60%);
    z-index:-1;
    animation:pulse 6s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{opacity:0.4;}
    50%{opacity:0.9;}
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,0.12);

    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* container */
.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

/* ➕ BUTTON */
.add-container{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
}

.add-btn{
    padding:10px 16px;
    border-radius:14px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);
    color:white;
    text-decoration:none;

    transition:0.3s;
}

.add-btn:hover{
    transform:translateY(-4px) scale(1.03);
    background:rgba(37,99,235,0.25);
}

/* 🧊 CARD (GLASS + FLOAT) */
.card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);

    padding:16px;
    margin-bottom:12px;

    border-radius:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:relative;
    overflow:hidden;

    transition:0.4s ease;

    animation: floatCard 6s ease-in-out infinite;
}

/* floating movement */
@keyframes floatCard{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
}

/* glow sweep effect */
.card::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:100%;
    height:100%;

    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.15),transparent);
    transition:0.6s;
}

.card:hover::before{
    left:120%;
}

.card:hover{
    transform:translateY(-8px) scale(1.01);
    background:rgba(255,255,255,0.09);
}

/* text */
.card h3{
    margin:0;
    font-size:18px;
}

.card p{
    margin-top:5px;
    color:#cbd5e1;
    font-size:13px;
}

/* actions */
.actions a{
    margin-left:6px;
    padding:7px 12px;
    border-radius:12px;
    text-decoration:none;
    font-size:13px;
    color:white;

    transition:0.3s;
    display:inline-block;
}

.edit{
    background:rgba(245,158,11,0.25);
}

.delete{
    background:rgba(239,68,68,0.25);
}

.actions a:hover{
    transform:scale(1.1);
}

/* back */
.back{
    display:inline-block;
    margin-top:20px;
    padding:10px 14px;
    border-radius:14px;

    background:rgba(255,255,255,0.08);
    color:white;
    text-decoration:none;

    transition:0.3s;
}

.back:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,0.15);
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="glow"></div>

<div class="header">📅 نظام الجلسات</div>

<div class="container">

<div class="add-container">
    <a href="/add_session_page" class="add-btn">➕ إضافة جلسة</a>
</div>

{% for s in sessions %}

<div class="card">

    <div>
        <h3>📌 {{ s.name }}</h3>
        <p>⏰ {{ s.session_time }} | 👨‍🏫 {{ s.supervisor }}</p>
    </div>

    <div class="actions">
        <a class="edit" href="/edit_session/{{ s.id }}">✏️</a>
        <a class="delete" href="/delete_session/{{ s.id }}">🗑️</a>
    </div>

</div>

{% endfor %}

<a class="back" href="/dashboard">⬅ رجوع</a>

</div>

</body>
</html>
