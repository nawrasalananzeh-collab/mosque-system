<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

/* 🌌 الخلفية */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
                radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
                radial-gradient(circle at 50% 80%, #0f172a, #020617);

    background-size:200% 200%;
    animation: bgMove 10s ease-in-out infinite;
}

/* توهج الخلفية */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at center,
        rgba(59,130,246,0.18),
        transparent 70%);
    animation: pulseGlow 6s ease-in-out infinite;
    pointer-events:none;
}

/* 🔥 البسملة بالأعلى بخط قرآني */
.top-basmala{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Amiri', serif;
    font-size:26px;
    color:#ffffff;

    text-shadow:
        0 0 10px rgba(255,255,255,0.4),
        0 0 25px rgba(59,130,246,0.5);

    animation: floatBasmala 4s ease-in-out infinite;
    z-index:10;
}

/* حركة خفيفة */
@keyframes floatBasmala{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-6px);}
}

/* الخلفية */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes pulseGlow{
    0%,100%{opacity:0.4; transform:scale(1);}
    50%{opacity:0.8; transform:scale(1.1);}
}

/* 🔥 الشعار */
.logo-top{
    position:fixed;
    top:15px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    color:white;

    animation: floatLogo 4s ease-in-out infinite, glow 2.5s ease-in-out infinite;
}

.logo-left{ left:15px; }
.logo-right{ right:15px; }

@keyframes floatLogo{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-8px) scale(1.06);}
}

@keyframes glow{
    0%,100%{
        box-shadow:0 0 10px rgba(37,99,235,0.4),
                   0 10px 25px rgba(0,0,0,0.5);
    }
    50%{
        box-shadow:0 0 25px rgba(37,99,235,0.9),
                   0 0 45px rgba(29,78,216,0.6);
    }
}

/* المحتوى */
.container{
    text-align:center;
}

/* العنوان */
.title{
    color:#cbd5e1;
    font-size:15px;
    margin-bottom:20px;
}

/* 🧊 الصندوق */
.box{
    width:370px;
    padding:38px;
    border-radius:24px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border:1px solid rgba(255,255,255,0.18);

    box-shadow:
        0 25px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.3);

    position:relative;
    overflow:hidden;

    animation: floatBox 6s ease-in-out infinite;
}

@keyframes floatBox{
    0%,100%{transform:translateY(0px) scale(1);}
    50%{transform:translateY(-10px) scale(1.01);}
}

/* الإدخال */
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    background: rgba(255,255,255,0.12);
    color:white;
    outline:none;
}

input::placeholder{
    color:#cbd5e1;
}

/* الزر */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background: linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 25px rgba(37,99,235,0.45);
}

</style>
</head>

<body>

<!-- 🕌 البسملة بالأعلى -->
<div class="top-basmala">
    بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ
</div>

<div class="logo-top logo-left">🕌</div>
<div class="logo-top logo-right">🕌</div>

<div class="container">

    <div class="title">
         اهلا   بك في نظام إدارة المعلومات 
    </div>
<div class="title">
لمسجد سعد بن معاذ
</div>
    <div class="box">

        <h2 style="color:white;">🔐 تسجيل الدخول</h2>

        <form method="POST">

            <input type="text" name="username" placeholder="اسم المستخدم" required>

            <input type="password" name="password" placeholder="كلمة المرور" required>

            <button type="submit">دخول</button>

        </form>

    </div>

</div>

</body>
</html>
