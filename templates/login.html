<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | نظام إدارة المسجد</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;

    /* 🔥 خلفية المسجد */
    background:
    linear-gradient(rgba(5,8,12,.78), rgba(5,8,12,.78)),
    url("https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

/* glow يمين */
body::after{
    content:"";
    position:absolute;
    width:900px;
    height:900px;
    background:radial-gradient(circle,#22c55e30,#00000000 65%);
    top:-300px;
    right:-300px;
    filter:blur(90px);
    z-index:0;
}

/* glow يسار */
.bg-glow{
    position:absolute;
    width:900px;
    height:900px;
    background:radial-gradient(circle,#3b82f630,#00000000 65%);
    bottom:-350px;
    left:-300px;
    filter:blur(100px);
    z-index:0;
}

/* container */
.container{
    width:100%;
    max-width:900px;
    padding:20px;
    z-index:10;
    position:relative;
}

/* الصندوق الرئيسي */
.login-box{
    display:flex;
    flex-direction:row;
    background: rgba(15, 20, 28, .55);
    backdrop-filter: blur(22px);
    border-radius: 28px;
    overflow:hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.12);
}

/* اليسار */
.header{
    width:40%;
    background:linear-gradient(135deg,#16a34a,#22c55e);
    padding:35px 20px;
    text-align:center;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.logo{
    width:85px;
    height:85px;
    background:rgba(255,255,255,.18);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    margin-bottom:12px;
}

.header h1{
    font-size:20px;
    font-weight:900;
}

.header p{
    font-size:13px;
    opacity:.95;
}

/* صورة الكعبة */
.kaaba{
    width:100%;
    margin-top:15px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.25);
}

.kaaba img{
    width:100%;
    height:140px;
    object-fit:cover;
}

/* اليمين */
.form-area{
    width:60%;
    padding:30px;
    background:rgba(15,20,28,.35);
}

/* box */
.welcome-box{
    background:linear-gradient(135deg,#f59e0b,#facc15);
    color:white;
    padding:10px;
    border-radius:12px;
    text-align:center;
    margin-bottom:18px;
    font-weight:800;
    font-size:13px;
}

/* inputs */
.input-group{
    margin-bottom:14px;
}

label{
    display:block;
    margin-bottom:6px;
    color:#e5e7eb;
    font-weight:800;
    font-size:13px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    font-size:14px;
    color:white;
}

input:focus{
    outline:none;
    border-color:#22c55e;
    box-shadow:0 0 0 4px rgba(34,197,94,.15);
}

/* زر */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

/* features */
.features{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.feature{
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    font-size:13px;
    font-weight:900;
    color:white;
}

.f1{background:linear-gradient(135deg,#22c55e,#16a34a);}
.f2{background:linear-gradient(135deg,#3b82f6,#2563eb);}
.f3{background:linear-gradient(135deg,#f59e0b,#ea580c);}
.f4{background:linear-gradient(135deg,#ef4444,#dc2626);}

/* footer */
.footer{
    margin-top:12px;
    text-align:center;
    font-size:12px;
    color:#94a3b8;
}

/* responsive */
@media(max-width:800px){
    .login-box{
        flex-direction:column;
    }

    .header,.form-area{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="container">

<div class="login-box">

    <!-- اليسار -->
    <div class="header">

        <div class="logo">🕌</div>

        <h1>نظام إدارة المسجد</h1>
        <p>إدارة الطلاب والمعهد والاختبارات</p>

        <!-- 🕋 صورة الكعبة -->
        <div class="kaaba">
            <img src="https://images.unsplash.com/photo-1580402427914-a6cc6d7a49d4?auto=format&fit=crop&w=800&q=80">
        </div>

    </div>

    <!-- اليمين -->
    <div class="form-area">

        <div class="welcome-box">
            تسجيل دخول آمن للنظام
        </div>

        <form method="POST">

            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" name="username" placeholder="أدخل اسم المستخدم" required>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit">دخول</button>

        </form>

        <!-- features -->
        <div class="features">
            <div class="feature f1">الطلاب</div>
            <div class="feature f2">المعهد</div>
            <div class="feature f3">الاختبارات</div>
            <div class="feature f4">التقارير</div>
        </div>

        <div class="footer">
            © نظام إدارة المسجد
        </div>

    </div>

</div>

</div>

</body>
</html>
