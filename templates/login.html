<!DOCTYPE html>
<html lang="ar">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

/* 🌌 الخلفية */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    background:#020617;
    color:white;
    padding:20px;
    position:relative;
}

/* توهج الخلفية */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 50% 40%,
        rgba(59,130,246,0.20),
        transparent 70%);
    pointer-events:none;
}

/* 🔥 البسملة */
.top-basmala{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Amiri', serif;
    font-size:22px;
    color:#ffffff;
    text-shadow:0 0 15px rgba(59,130,246,0.6);
    z-index:10;
}

/* 🔥 الشعار */
.logo-top{
    position:fixed;
    top:15px;
    width:65px;
    height:65px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    color:white;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.logo-left{ left:15px; }
.logo-right{ right:15px; }

/* المحتوى */
.container{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

/* العنوان */
.title{
    color:#cbd5e1;
    font-size:15px;
    margin-bottom:6px;
}

/* 🧊 الصندوق */
.box{
    width:90%;
    max-width:420px;
    padding:28px;
    border-radius:20px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:0 25px 60px rgba(0,0,0,0.55);

    position:relative;
}

/* الإدخال */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    background: rgba(255,255,255,0.12);
    color:white;
    outline:none;
}

/* الزر */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background: linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 25px rgba(37,99,235,0.45);
}

/* 📱 موبايل */
@media (max-width:600px){
    .box{
        width:95%;
        padding:20px;
    }

    .top-basmala{
        font-size:18px;
    }
}

</style>
</head>

<body>

<div class="top-basmala">
    بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ
</div>

<div class="logo-top logo-left">🕌</div>
<div class="logo-top logo-right">🕌</div>

<div class="container">

    <div class="title">اهلا بك في نظام إدارة المعلومات</div>
    <div class="title">لمسجد سعد بن معاذ</div>

    <div class="box">

        <h2 style="color:white;">🔐 تسجيل الدخول</h2>

        <form method="POST">

            <input type="text" name="username" placeholder="اسم المستخدم" required>

            <input type="password" name="password" placeholder="كلمة المرور" required>

            <button type="submit">دخول</button>

        </form>

    </div>

</div>

</body>
</html>
