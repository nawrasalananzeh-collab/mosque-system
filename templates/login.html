<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>

    /* RESET */
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Cairo', sans-serif;
    }

    /* 🌌 الخلفية المتحركة */
    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow-x:hidden;
        background:#050816;
        color:white;
        position:relative;
        padding:20px;
    }

    /* الخلفية */
    .bg{
        position:fixed;
        inset:0;
        background:
            radial-gradient(circle,#2563eb55, transparent 30%),
            radial-gradient(circle,#06b6d455, transparent 40%),
            radial-gradient(circle,#1d4ed855, transparent 30%),
            linear-gradient(120deg,#020617,#0b1220);
        animation:bgMove 20s linear infinite;
        z-index:-2;
        filter:blur(80px);
        opacity:0.9;
    }

    @keyframes bgMove{
        0%{
            transform:translate(-5%,-5%) rotate(0deg);
        }
        50%{
            transform:translate(5%,5%) rotate(180deg);
        }
        100%{
            transform:translate(-5%,-5%) rotate(360deg);
        }
    }

    /* كرات ضوئية متحركة */
    body::before,
    body::after{
        content:"";
        position:fixed;
        width:500px;
        height:500px;
        border-radius:50%;
        filter:blur(80px);
        z-index:-1;
    }

    body::before{
        background:#2563eb;
        top:-150px;
        right:-150px;
        animation:orb1 12s ease-in-out infinite;
    }

    body::after{
        background:#06b6d4;
        bottom:-150px;
        left:-150px;
        animation:orb2 14s ease-in-out infinite;
    }

    @keyframes orb1{
        0%,100%{
            transform:translate(0,0);
        }
        50%{
            transform:translate(-150px,120px);
        }
    }

    @keyframes orb2{
        0%,100%{
            transform:translate(0,0);
        }
        50%{
            transform:translate(150px,-120px);
        }
    }

    /* البسملة */
    .top-basmala{
        position:fixed;
        top:18px;
        left:50%;
        transform:translateX(-50%);
        font-family:'Amiri', serif;
        font-size:22px;
        color:#ffffff;
        text-shadow:0 0 15px rgba(59,130,246,0.6);
        z-index:10;
    }

    /* الشعار */
    .logo-top{
        position:fixed;
        top:15px;
        width:65px;
        height:65px;
        border-radius:50%;
        background:linear-gradient(135deg,#2563eb,#1d4ed8);
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:26px;
        color:white;
        box-shadow:0 10px 25px rgba(0,0,0,0.5);
    }

    .logo-left{ left:15px; }
    .logo-right{ right:15px; }

    /* المحتوى */
    .container{
        width:100%;
        display:flex;
        flex-direction:column;
        align-items:center;
        text-align:center;
    }

    /* العنوان */
    .title{
        color:#cbd5e1;
        font-size:15px;
        margin-bottom:6px;
    }

    /* 🧊 الصندوق */
    .box{
        width:90%;
        max-width:420px;
        padding:40px;
        border-radius:20px;
        background: rgba(255,255,255,0.06);
        backdrop-filter: blur(25px);
        border:1px solid rgba(255,255,255,0.15);
        box-shadow:0 25px 60px rgba(0,0,0,0.55);
        position:relative;
        animation:floatBox 6s ease-in-out infinite;
    }

    @keyframes floatBox{
        0%,100%{
            transform:translateY(0);
        }
        50%{
            transform:translateY(-12px);
        }
    }

    /* الإدخال */
    input{
        width:100%;
        padding:12px;
        margin:10px 0;
        border-radius:10px;
        border:none;
        background: rgba(255,255,255,0.12);
        color:white;
        outline:none;
    }

    /* الزر */
    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:10px;
        background: linear-gradient(135deg,#2563eb,#1d4ed8);
        color:white;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        transform:translateY(-2px);
        box-shadow:0 15px 25px rgba(37,99,235,0.45);
    }

    /* 📱 موبايل */
    @media (max-width:600px){
        .box{
            width:95%;
            padding:25px;
        }

        .top-basmala{
            font-size:18px;
        }
    }

    </style>
</head>

<body>

<div class="bg"></div>

<div class="top-basmala">
    بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ
</div>

<div class="logo-top logo-left">🕌</div>
<div class="logo-top logo-right">🕌</div>

<div class="container">

    <div class="title">اهلا بك في نظام إدارة المعلومات</div>
    <div class="title">لمسجد سعد بن معاذ</div>

    <div class="box">

        <h2 style="color:white;">🔐 تسجيل الدخول</h2>

        <form method="POST">

            <input type="text" name="username" placeholder="اسم المستخدم" required>

            <input type="password" name="password" placeholder="كلمة المرور" required>

            <button type="submit">دخول</button>

        </form>

    </div>

</div>

</body>
</html>
