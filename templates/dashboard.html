<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الواجهة الرئيسية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    color:white;
    overflow-x:hidden;
    position:relative;

    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, #020617);

    background-size:200% 200%;
    animation:bgMove 10s ease-in-out infinite;
}

/* الخلفية */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle at center, rgba(59,130,246,.18), transparent 70%);
    animation:pulseGlow 6s ease-in-out infinite;
    pointer-events:none;
    z-index:-1;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes pulseGlow{
    0%,100%{opacity:.4; transform:scale(1);}
    50%{opacity:.8; transform:scale(1.1);}
}

.header{
    text-align:center;
    padding:15px;
    font-size:26px;
    font-weight:700;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

/* 🔥 أهم تعديل هنا */
.container{
    display:grid;
    grid-template-columns: 280px 1fr 280px;
    gap:20px;
    padding:25px;
}

/* الأعمدة */
.column{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* أزرار */
.btn{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    text-decoration:none;
    color:#fff;

    padding:12px 16px;
    min-height:44px;

    font-size:16px;
    font-weight:700;

    border-radius:16px;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    transition:.3s ease;
}

.btn:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.13);
}

/* الوسط */
.center{
    display:flex;
    justify-content:center;
    align-items:center;
}

.welcome-box{
    width:100%;
    max-width:700px;
    text-align:center;
    padding:50px;
    border-radius:24px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,.18);
}

.welcome-box h2{
    font-size:38px;
}
.welcome-box p{
    font-size:22px;
    color:#dbeafe;
}

/* 🔥 TABLET */
@media(max-width:1100px){
    .container{
        grid-template-columns: 220px 1fr;
    }
    .column:last-child{
        grid-column: span 2;
        flex-direction:row;
        flex-wrap:wrap;
    }
    .column:last-child .btn{
        flex:1 1 45%;
    }
}

/* 🔥 MOBILE */
@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }

    .column{
        width:100%;
    }

    .btn{
        font-size:15px;
        padding:14px;
    }

    .welcome-box{
        padding:30px;
    }

    .welcome-box h2{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="header">
    🕌 الواجهة الرئيسية
</div>

<div class="container">

    <div class="column">
        <a href="/students" class="btn">👨‍🎓 إدارة الطلاب</a>
        <a href="/users_pin" class="btn">👤 المستخدمون</a>
        <a href="/teachers" class="btn">👨‍🏫 المعلمون</a>
        <a href="/sessions" class="btn">📅 الجلسات</a>
        <a href="#">📊 التقارير</a>
        <a href="/hafaz" class="btn">📖 الحفاظ</a>
        <a href="/khatmat" class="btn">🕋 الختمات</a>
        <a href="/tests" class="btn">📝 الاختبارات</a>
    </div>

    <div class="center">
        <div class="welcome-box">
            <h2>👋 أهلاً بك {{ username }}</h2>
            <p>نظام إدارة مسجد سعد بن معاذ</p>
        </div>
    </div>

    <div class="column">
        <a href="#">🌙 الوضع الليلي</a>
        <a href="#">🛡️ الصلاحيات</a>
        <a href="#">💰 التبرعات</a>
        <a href="#">🏆 المسابقات</a>
        <a href="/umrah" class="btn">🕋 العمرات</a>
        <a href="#">⚙️ الإعدادات</a>
        <a href="/dashboard" class="btn">🏠 الداشبورد</a>
        <a href="/logout" class="btn">🚪 تسجيل الخروج</a>
    </div>

</div>

</body>
</html>
