<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الواجهة الرئيسية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    color:white;
    position:relative;

    /* 🔥 نفس خلفية تسجيل الدخول */
    background:
    linear-gradient(rgba(5,8,12,.78), rgba(5,8,12,.78)),
    url("https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

/* glow يمين */
body::after{
    content:"";
    position:absolute;
    width:900px;
    height:900px;
    background:radial-gradient(circle,#22c55e30,#00000000 65%);
    top:-300px;
    right:-300px;
    filter:blur(90px);
    z-index:0;
}

/* glow يسار */
body::before{
    content:"";
    position:absolute;
    width:900px;
    height:900px;
    background:radial-gradient(circle,#3b82f630,#00000000 65%);
    bottom:-350px;
    left:-300px;
    filter:blur(100px);
    z-index:0;
}

/* header */
.header{
    width:fit-content;
    margin:18px auto;

    padding:12px 28px;

    font-size:26px;
    font-weight:900;

    border-radius:18px;

    background:rgba(15,20,28,.55);
    backdrop-filter:blur(22px);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:0 20px 60px rgba(0,0,0,.5);

    position:relative;
    z-index:2;
}

/* layout */
.container{
    display:flex;
    justify-content:space-between;
    align-items:stretch;
    padding:25px;
    gap:20px;
    position:relative;
    z-index:2;
}

/* columns */
.column{
    width:320px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* buttons */
.btn{
    padding:12px 14px;
    border-radius:14px;

    text-decoration:none;
    color:white;

    font-size:15px;
    font-weight:800;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);

    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.12);
    border-color:#22c55e55;
}

/* center card */
.center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

.welcome-box{
    width:100%;
    max-width:650px;

    padding:50px 40px;
    text-align:center;

    background:rgba(15,20,28,.55);
    backdrop-filter:blur(22px);

    border:1px solid rgba(255,255,255,.12);
    border-radius:26px;

    box-shadow:0 30px 90px rgba(0,0,0,.6);

    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

.welcome-box h2{
    font-size:34px;
    margin-bottom:12px;
}

.welcome-box p{
    font-size:18px;
    color:#cbd5e1;
}

/* responsive */
@media(max-width:900px){
    .container{
        flex-direction:column;
        align-items:center;
    }

    .column{
        width:100%;
        max-width:600px;
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }

    .btn{
        text-align:center;
        justify-content:center;
    }
}

@media(max-width:500px){
    .column{
        grid-template-columns:1fr;
    }

    .welcome-box{
        padding:25px;
    }

    .welcome-box h2{
        font-size:22px;
    }

    .welcome-box p{
        font-size:15px;
    }
}

</style>
</head>

<body>

<div class="header">🕌 الواجهة الرئيسية</div>

<div class="container">

    <!-- يسار -->
    <div class="column">
        <a href="/students" class="btn">👨‍🎓 الطلاب</a>
        <a href="/users_pin" class="btn">👤 المستخدمون</a>
        <a href="/teachers" class="btn">👨‍🏫 المشايخ</a>
        <a href="/sessions" class="btn">📅 الجلسات</a>
        <a href="/hafaz" class="btn">📖 الحفاظ</a>
        <a href="/khatmat" class="btn">🕋 الختمات</a>
        <a href="/tests" class="btn">📝 الاختبارات</a>
    </div>

    <!-- وسط -->
    <div class="center">
        <div class="welcome-box">
            <h2>👋 أهلاً بك {{ username }}</h2>
            <p>نظام إدارة المسجد - لوحة التحكم الرئيسية</p>
        </div>
    </div>

    <!-- يمين -->
    <div class="column">
        <a href="/competitions" class="btn">🏆 المسابقات</a>
        <a href="/transport_cars" class="btn">🚐 التوصيل</a>
        <a href="/institute" class="btn">🏫 المعهد</a>
        <a href="/backup" class="btn">💾 النسخ الاحتياطي</a>
        <a href="/umrah" class="btn">🕋 العمرات</a>
        <a href="/settings" class="btn">⚙️ الإعدادات</a>
        <a href="/logout" class="btn">🚪 تسجيل الخروج</a>
    </div>

</div>

</body>
</html>
