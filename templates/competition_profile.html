```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ competition['title'] }}</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#050816;
    color:white;
    min-height:100vh;
    padding:30px;
    overflow-x:hidden;
}

.bg{
    position:fixed;
    inset:-20%;
    z-index:-2;
    background:
        radial-gradient(circle,#2563eb 0%,transparent 25%),
        radial-gradient(circle,#06b6d4 0%,transparent 30%),
        radial-gradient(circle,#1d4ed8 0%,transparent 25%);
    background-size:40% 40%;
    animation:bgMove 20s linear infinite;
    filter:blur(100px);
    opacity:.9;
}

@keyframes bgMove{
    0%{transform:translate(-5%,-5%) rotate(0deg);}
    50%{transform:translate(5%,5%) rotate(180deg);}
    100%{transform:translate(-5%,-5%) rotate(360deg);}
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:25px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
}

.title{
    text-align:center;
    font-size:36px;
    font-weight:800;
    margin-bottom:15px;

    background:linear-gradient(90deg,#60a5fa,#22d3ee,#3b82f6);
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.desc{
    text-align:center;
    color:#cbd5e1;
    line-height:2;
}

.section-title{
    font-size:24px;
    margin-bottom:15px;
    color:#60a5fa;
}

select,
input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    color:white;
    margin-bottom:12px;
}

button{
    border:none;
    cursor:pointer;
    padding:12px 18px;
    border-radius:14px;
    color:white;
    font-weight:700;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

.add-btn{
    background:linear-gradient(135deg,#22c55e,#16a34a);
}

.update-btn{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.participant{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:18px;
    margin-top:15px;
}

.name{
    font-size:20px;
    font-weight:700;
}

.score{
    color:#facc15;
    margin:10px 0;
    font-size:18px;
}

.delete-btn{
    display:inline-block;
    text-decoration:none;
    margin-top:10px;
    padding:10px 15px;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.delete-btn:hover{
    opacity:.9;
}

.back{
    display:inline-block;
    text-decoration:none;
    margin-bottom:20px;
    padding:12px 18px;
    border-radius:14px;
    color:white;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
}

@media(max-width:700px){

    body{
        padding:15px;
    }

    .title{
        font-size:28px;
    }

}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<a href="/competitions" class="back">
    ↩️ العودة للمسابقات
</a>

<div class="card">

    <h1 class="title">
        🏆 {{ competition['title'] }}
    </h1>

    <p class="desc">
        {{ competition['description'] }}
    </p>

</div>

<div class="card">

    <h2 class="section-title">
        ➕ إضافة طالب للمسابقة
    </h2>

    <form method="POST" action="/add_participant/{{ competition['id'] }}">

        <select name="student_id">

            {% for s in students %}
            <option value="{{ s['id'] }}">
                {{ s['name'] }}
            </option>
            {% endfor %}

        </select>

        <button type="submit" class="add-btn">
            إضافة الطالب
        </button>

    </form>

</div>

<div class="card">

    <h2 class="section-title">
        🏆 المشاركون
    </h2>

    {% for p in participants %}

    <div class="participant">

        <div class="name">
            👤 {{ p['student_name'] }}
        </div>

        <div class="score">
            ⭐ النقاط: {{ p['score'] }}
        </div>

        <form method="POST" action="/update_score/{{ p['id'] }}/{{ competition['id'] }}">

            <input
                name="score"
                type="number"
                placeholder="تعديل النقاط"
            >

            <button type="submit" class="update-btn">
                تحديث النقاط
            </button>

        </form>

        <a
           href="/delete_participant/{{ p['id'] }}/{{ competition['id'] }}"
           class="delete-btn"
           onclick="return confirm('حذف المشارك؟')">
            🗑️ حذف
        </a>

    </div>

    {% endfor %}

</div>

</div>

</body>
</html>
```
