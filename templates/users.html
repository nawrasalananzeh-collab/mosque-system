<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>المستخدمون</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

/* 🌌 خلفية ديناميكية */
body{
    min-height:100vh;
    color:white;
    overflow-x:hidden;
    background:#020617;
}

/* طبقات خلفية متحركة */
.bg{
    position:fixed;
    inset:-50%;
    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, transparent 60%);
    animation:moveBG 12s ease-in-out infinite;
    z-index:-3;
}

@keyframes moveBG{
    0%{transform:translate(0,0);}
    50%{transform:translate(60px,-40px);}
    100%{transform:translate(0,0);}
}

/* 🌫 طبقة ضوء ناعم */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle at center, rgba(59,130,246,0.15), transparent 70%);
    animation:pulse 6s ease-in-out infinite;
    pointer-events:none;
}

@keyframes pulse{
    0%,100%{opacity:0.4;}
    50%{opacity:0.8;}
}

/* 📦 الحاوية */
.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

/* 🧾 العنوان */
h1{
    text-align:center;
    margin-bottom:25px;
    font-size:28px;
}

/* 🧊 الفورم */
form{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

/* ✨ input زجاجي */
input{
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);
    flex:1;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(12px);

    color:white;
    outline:none;

    transition:0.3s;
}

input:focus{
    transform:scale(1.03);
    background:rgba(255,255,255,0.12);
}

/* 🔘 زر إضافة */
button{
    padding:12px 18px;
    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    font-weight:bold;

    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
}

/* 📊 جدول زجاجي */
table{
    width:100%;
    border-collapse:collapse;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(18px);

    border-radius:14px;
    overflow:hidden;
}

th,td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

th{
    background:rgba(255,255,255,0.08);
}

/* 🔘 أزرار العمليات */
.action-btn{
    padding:7px 10px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    display:inline-block;
    margin:2px;
    transition:0.3s;

    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
}

.action-btn:hover{
    transform:translateY(-3px) scale(1.05);
}

/* ألوان */
.edit{
    background:rgba(245,158,11,0.25);
}

.delete{
    background:rgba(239,68,68,0.25);
}

/* 🔙 زر الرجوع */
.back{
    display:inline-block;
    margin-top:20px;
    padding:12px 18px;
    background:rgba(71,85,105,0.35);
    border-radius:12px;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.back:hover{
    transform:translateY(-3px);
    background:rgba(71,85,105,0.5);
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<h1>👥 إدارة المستخدمين</h1>

<form method="POST" action="/add_user">
    <input type="text" name="username" placeholder="اسم المستخدم" required>
    <input type="password" name="password" placeholder="كلمة المرور" required>
    <button type="submit">➕ إضافة</button>
</form>

<table>

<tr>
    <th>ID</th>
    <th>اسم المستخدم</th>
    <th>كلمة المرور</th>
    <th>الإجراءات</th>
</tr>

{% for u in users %}
<tr>
    <td>{{ u.id }}</td>
    <td>{{ u.username }}</td>
    <td>{{ u.password }}</td>

    <td>
        <a class="action-btn edit" href="/edit_user/{{ u.id }}">✏️ تعديل</a>
        <a class="action-btn delete" href="/delete_user/{{ u.id }}" onclick="return confirm('هل أنت متأكد؟')">🗑 حذف</a>
    </td>
</tr>
{% endfor %}

</table>

<a href="/dashboard" class="back">⬅ الرجوع للداشبورد</a>

</div>

</body>
</html>
