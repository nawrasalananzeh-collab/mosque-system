<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المعهد</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    background:#050816;
    color:white;
    overflow-x:hidden;
    position:relative;
}

/* خلفية */
.bg{
    position:fixed;
    inset:-20%;
    z-index:-2;

    background:
        radial-gradient(circle,#2563eb 0%,transparent 25%),
        radial-gradient(circle,#06b6d4 0%,transparent 30%),
        radial-gradient(circle,#1d4ed8 0%,transparent 25%);

    background-size:40% 40%;
    animation:bgMove 20s linear infinite;

    filter:blur(100px);
    opacity:.9;
}

@keyframes bgMove{
    0%{transform:translate(-5%,-5%) rotate(0deg);}
    50%{transform:translate(5%,5%) rotate(180deg);}
    100%{transform:translate(-5%,-5%) rotate(360deg);}
}

/* زر رجوع */
.back{
    position:absolute;
    top:20px;
    right:20px;

    padding:10px 18px;
    border-radius:14px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:white;
    text-decoration:none;

    transition:.2s;
}

.back:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.15);
}

/* العنوان */
.header{
    text-align:center;
    margin-top:40px;
    font-size:34px;
    font-weight:800;
}

/* الكروت */
.container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding:40px;
    margin-top:40px;
}

.card{
    padding:50px 20px;
    text-align:center;

    border-radius:20px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    transition:.3s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-10px);
    background:rgba(255,255,255,.12);
}

.card a{
    color:white;
    text-decoration:none;
    font-size:26px;
    font-weight:bold;
}

/* موبايل */
@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<div class="bg"></div>

<a href="/dashboard" class="back">⬅ رجوع</a>

<div class="header">🕌 المعهد</div>

<div class="container">

    <div class="card">
        <a href="#">📚 الفقه</a>
    </div>

    <div class="card">
        <a href="#">📖 العقيدة</a>
    </div>

    <div class="card">
        <a href="#">📝 الامتحانات</a>
    </div>

</div>

</body>
</html>
