<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;

    /* 🔥 نفس الخلفية تماماً */
    background:
    linear-gradient(rgba(5,8,12,.75), rgba(5,8,12,.75)),
    url("https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

/* glow يمين */
body::after{
    content:"";
    position:absolute;
    width:900px;
    height:900px;
    background:radial-gradient(circle,#22c55e30,#00000000 65%);
    top:-300px;
    right:-300px;
    filter:blur(90px);
    z-index:0;
}

/* glow يسار */
.bg-glow{
    position:absolute;
    width:900px;
    height:900px;
    background:radial-gradient(circle,#3b82f630,#00000000 65%);
    bottom:-350px;
    left:-300px;
    filter:blur(100px);
    z-index:0;
}

/* container */
.container{
    width:100%;
    max-width:900px;
    padding:20px;
    z-index:10;
    position:relative;
}

/* الصندوق الرئيسي */
.login-box{
    display:flex;
    flex-direction:row;
    background: rgba(15, 20, 28, .55);
    backdrop-filter: blur(22px);
    border-radius: 28px;
    overflow:hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.12);
}

/* اليسار (نفس login) */
.header{
    width:40%;
    background:linear-gradient(135deg,#16a34a,#22c55e);
    padding:40px 20px;
    text-align:center;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.logo{
    width:90px;
    height:90px;
    background:rgba(255,255,255,.18);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:44px;
    margin-bottom:12px;
}

.header h1{
    font-size:22px;
    font-weight:800;
}

.header p{
    font-size:13px;
    opacity:.95;
}

/* اليمين */
.form-area{
    width:60%;
    padding:35px;
    background:rgba(15,20,28,.35);
}

/* welcome box */
.welcome-box{
    background:linear-gradient(135deg,#f59e0b,#facc15);
    color:white;
    padding:10px;
    border-radius:12px;
    text-align:center;
    margin-bottom:18px;
    font-weight:800;
    font-size:13px;
}

/* النص */
h1{
    color:white;
    font-size:24px;
    margin-top:10px;
    text-align:center;
}

p{
    color:#cbd5e1;
    font-size:14px;
    text-align:center;
    margin-top:10px;
}

/* الأزرار */
.buttons{
    margin-top:25px;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

a.btn{
    padding:12px 18px;
    border-radius:10px;
    text-decoration:none;
    font-weight:900;
    transition:.2s;
    text-align:center;
}

/* زر الدخول */
.enter{
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
}

/* زر رجوع */
.back{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:white;
}

.enter:hover,
.back:hover{
    transform:translateY(-2px);
}

/* features نفس login */
.features{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.feature{
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    font-size:13px;
    font-weight:900;
    color:white;
}

.f1{background:linear-gradient(135deg,#22c55e,#16a34a);}
.f2{background:linear-gradient(135deg,#3b82f6,#2563eb);}
.f3{background:linear-gradient(135deg,#f59e0b,#ea580c);}
.f4{background:linear-gradient(135deg,#ef4444,#dc2626);}

/* responsive */
@media(max-width:800px){
    .login-box{
        flex-direction:column;
    }

    .header,.form-area{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="container">

<div class="login-box">

    <!-- يسار نفس login -->
    <div class="header">
        <div class="logo">🕌</div>
        <h1>نظام إدارة المسجد</h1>
        <p>إدارة الطلاب والمعهد والاختبارات</p>
    </div>

    <!-- يمين -->
    <div class="form-area">

        <div class="welcome-box">
            تم تسجيل الدخول بنجاح
        </div>

        <h1>مرحباً {{ username }}</h1>
        <p>أهلاً بك في النظام الإداري للمسجد</p>

        <div class="buttons">
            <a href="/dashboard" class="btn enter">الدخول للنظام</a>
            <a href="/" class="btn back">تسجيل خروج</a>
        </div>

        <div class="features">
            <div class="feature f1">الطلاب</div>
            <div class="feature f2">المعهد</div>
            <div class="feature f3">الاختبارات</div>
            <div class="feature f4">التقارير</div>
        </div>

    </div>

</div>

</div>

</body>
</html>
