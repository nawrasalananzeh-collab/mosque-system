<!DOCTYPE html>
<html lang="ar">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>صفحة الترحيب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

/* 🌌 الخلفية */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617;
    overflow:hidden;
    padding:20px;
    color:white;
}

/* الخلفية المتحركة */
.bg{
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, transparent 60%);
    animation: moveBG 12s ease-in-out infinite;
}

@keyframes moveBG{
    0%{transform:translate(0,0);}
    50%{transform:translate(40px,-30px);}
    100%{transform:translate(0,0);}
}

/* ⬅ زر الرجوع */
.back-btn{
    position:fixed;
    top:15px;
    left:15px;
    padding:10px 14px;
    background:#ef4444;
    color:white;
    text-decoration:none;
    border-radius:10px;
    z-index:20;
}

/* ✨ أهلاً أهلاً */
.big-welcome{
    position:relative;
    z-index:10;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:18px;

    background: linear-gradient(90deg,#60a5fa,#3b82f6,#22d3ee,#60a5fa);
    background-size:300% 100%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation: shineMove 3s linear infinite, popIn 0.8s ease-out;
}

@keyframes shineMove{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
}

@keyframes popIn{
    0%{
        transform:scale(0.5);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* 🧊 الصندوق */
.box{
    width: min(92vw, 420px);
    padding: clamp(18px, 4vw, 30px);
    border-radius: 22px;

    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:0 30px 80px rgba(0,0,0,0.65);

    position:relative;
    z-index:5;

    animation: floatBox 6s ease-in-out infinite;
}

@keyframes floatBox{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

/* 👋 الترحيب */
.greeting{
    margin-bottom:15px;
}

.hand{
    display:inline-block;
    font-size:32px;
    animation: wave 1.5s infinite;
    transform-origin:70% 70%;
}

@keyframes wave{
    0%{transform:rotate(0deg);}
    25%{transform:rotate(20deg);}
    50%{transform:rotate(-15deg);}
    75%{transform:rotate(20deg);}
    100%{transform:rotate(0deg);}
}

.greeting h2{
    font-size:24px;
}

.greeting span{
    color:#cbd5e1;
    font-size:16px;
}

/* النص */
.box h1{
    margin-top:10px;
    font-size:22px;
}

.box p{
    color:#cbd5e1;
    margin-top:6px;
}

/* زر الدخول */
.system-btn{
    display:inline-block;
    margin-top:18px;
    padding:14px 24px;
    background: linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    text-decoration:none;
    border-radius:12px;
    transition:0.3s;
}

.system-btn:hover{
    transform:translateY(-3px);
}

/* 📱 موبايل */
@media (max-width:600px){
    .big-welcome{
        font-size:22px;
    }

    .greeting h2{
        font-size:20px;
    }

    .box h1{
        font-size:19px;
    }
}

</style>
</head>

<body>

<div class="bg"></div>

<a href="/" class="back-btn">⬅ رجوع</a>

<!-- ✨ العنوان المتحرك -->
<div style="position:absolute; top:70px; width:100%; text-align:center;">
    <div class="big-welcome">أهلاً أهلاً 👋✨</div>
</div>

<div class="box">

    <div class="greeting">
        <div class="hand">👋</div>
        <h2>مرحبا بك</h2>
        <span>{{ username }}</span>
    </div>

    <h1>أهلاً بك في نظام إدارة المسجد 🕌</h1>

    <p>نظام إدارة المعلومات لمسجد سعد بن معاذ</p>
    <p>اضغط للدخول إلى لوحة التحكم</p>

    <a class="system-btn" href="/dashboard">الدخول إلى النظام 🚀</a>

</div>

</body>
</html>
