<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>صفحة الترحيب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

/* 🌌 الخلفية */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617;
    overflow:hidden;
    padding:20px;
    color:white;
}

/* الخلفية المتحركة */
.bg{
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, transparent 60%);
    animation:moveBG 12s ease-in-out infinite;
}

@keyframes moveBG{
    0%{transform:translate(0,0);}
    50%{transform:translate(40px,-30px);}
    100%{transform:translate(0,0);}
}

/* زر الرجوع */
.back-btn{
    position:fixed;
    top:15px;
    left:15px;

    padding:10px 15px;

    background:#ef4444;
    color:white;

    text-decoration:none;
    border-radius:10px;

    z-index:100;

    transition:.3s;
}

.back-btn:hover{
    background:#dc2626;
    transform:scale(1.05);
}

/* ✨ أهلاً أهلاً */
.big-welcome{
    position:fixed;
    top:25px;
    left:50%;
    transform:translateX(-50%);

    font-size:clamp(30px,4vw,44px);
    font-weight:800;

    white-space:nowrap;

    background:linear-gradient(
        90deg,
        #60a5fa,
        #3b82f6,
        #22d3ee,
        #60a5fa
    );

    background-size:300% 100%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        shineMove 3s linear infinite,
        popIn .8s ease-out;

    z-index:100;
}

@keyframes shineMove{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
}

@keyframes popIn{
    0%{
        opacity:0;
        transform:translateX(-50%) scale(.6);
    }

    100%{
        opacity:1;
        transform:translateX(-50%) scale(1);
    }
}

/* 🧊 الصندوق */
.box{
    width:min(92vw,430px);

    margin-top:110px;

    padding:28px;

    border-radius:24px;

    background:rgba(255,255,255,.07);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 30px 80px rgba(0,0,0,.65);

    text-align:center;

    position:relative;
    z-index:5;

    animation:floatBox 6s ease-in-out infinite;
}

@keyframes floatBox{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}

/* 👋 الترحيب */
.greeting{
    margin-bottom:18px;
}

.hand{
    display:inline-block;
    font-size:36px;

    animation:wave 1.5s infinite;

    transform-origin:70% 70%;
}

@keyframes wave{
    0%{transform:rotate(0);}
    25%{transform:rotate(20deg);}
    50%{transform:rotate(-15deg);}
    75%{transform:rotate(20deg);}
    100%{transform:rotate(0);}
}

.greeting h2{
    margin-top:8px;
    font-size:24px;
}

.greeting span{
    display:block;
    margin-top:4px;

    color:#cbd5e1;

    font-size:15px;
}

/* العنوان */
.box h1{
    font-size:24px;
    margin-bottom:12px;
}

/* النص */
.box p{
    color:#cbd5e1;
    font-size:15px;
    line-height:1.8;
}

/* زر الدخول */
.system-btn{
    display:inline-block;

    margin-top:22px;

    padding:13px 25px;

    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    text-decoration:none;

    border-radius:12px;

    font-size:15px;
    font-weight:700;

    transition:.3s;
}

.system-btn:hover{
    transform:translateY(-3px);
}

/* 📱 الهاتف */
/* 📱 الهاتف */
@media(max-width:600px){

    .big-welcome{
        top:18px;
        font-size:30px;
    }

    .box{
        width:95vw;
        max-width:95vw;
        margin-top:105px;
        padding:24px 20px;
        border-radius:20px;
    }

    .hand{
        font-size:34px;
    }

    .greeting h2{
        font-size:24px;
        margin-top:8px;
    }

    .greeting span{
        font-size:16px;
    }

    .box h1{
        font-size:24px;
        line-height:1.6;
        margin-bottom:12px;
    }

    .box p{
        font-size:16px;
        line-height:1.9;
    }

    .system-btn{
        width:100%;
        padding:15px;
        font-size:17px;
        margin-top:20px;
    }

    .back-btn{
        padding:10px 12px;
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="bg"></div>

<a href="/" class="back-btn">⬅ رجوع</a>

<div class="big-welcome">
    أهلاً أهلاً 👋✨
</div>

<div class="box">

    <div class="greeting">
        <div class="hand">👋</div>

        <h2>مرحباً بك</h2>

        <span>{{ username }}</span>
    </div>

    <h1>🕌 أهلاً بك في نظام إدارة المسجد</h1>

    <p>نظام إدارة المعلومات لمسجد سعد بن معاذ</p>

    <p>اضغط للدخول إلى لوحة التحكم</p>

    <a class="system-btn" href="/dashboard">
        🚀 الدخول إلى النظام
    </a>

</div>

</body>
</html>
