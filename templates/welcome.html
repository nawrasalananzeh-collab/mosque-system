<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>صفحة الترحيب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

/* 🌌 الخلفية */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#020617;
}

/* خلفية متحركة */
.bg{
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, transparent 60%);
    animation: moveBG 12s ease-in-out infinite;
}

@keyframes moveBG{
    0%{transform:translate(0,0);}
    50%{transform:translate(40px,-30px);}
    100%{transform:translate(0,0);}
}

/* ⬅️ زر الرجوع */
.back-btn{
    position:fixed;
    top:15px;
    left:15px;
    padding:10px 15px;
    background:#ef4444;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:0.3s;
    z-index:20;
}

.back-btn:hover{
    background:#dc2626;
    transform:scale(1.05);
}

/* 👋 الترحيب (مرفوع أكثر) */
.greeting{
    position:absolute;
    top:-170px; /* 🔥 رفع إضافي */
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    color:white;
    z-index:10;
}

.greeting h2{
    font-size:30px;
    margin-bottom:6px;
}

.greeting span{
    font-size:18px;
    color:#cbd5e1;
}

/* ✋ اليد */
.hand{
    display:inline-block;
    font-size:30px;
    animation: wave 1.5s infinite;
    transform-origin:70% 70%;
}

@keyframes wave{
    0%{transform:rotate(0deg);}
    25%{transform:rotate(20deg);}
    50%{transform:rotate(-15deg);}
    75%{transform:rotate(20deg);}
    100%{transform:rotate(0deg);}
}

/* 🧊 الصندوق */
.box{
    width:460px;
    text-align:center;

    padding:45px;
    border-radius:28px;

    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(30px);

    border:1px solid rgba(255,255,255,0.18);

    box-shadow:0 30px 80px rgba(0,0,0,0.65);

    position:relative;
    z-index:5;

    animation: floatBox 6s ease-in-out infinite;
}

@keyframes floatBox{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

/* نص داخل الصندوق */
.box h1{
    color:white;
    margin-bottom:10px;
}

.box p{
    color:#cbd5e1;
    margin-bottom:10px;
}
/* زر الدخول */
.system-btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 28px;
    background: linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    text-decoration:none;
    border-radius:12px;
    transition:0.3s;
}

.system-btn:hover{
    transform:translateY(-4px);
}

</style>
</head>

<body>

<div class="bg"></div>

<a href="/" class="back-btn">⬅ رجوع</a>

<div class="box">

    <!-- 👋 الترحيب (مرتفع أكثر الآن) -->
    <div class="greeting">
        <div class="hand">👋</div>
        <h2>مرحبا بك</h2>
        <span>{{ username }}</span>
    </div>

    <h1>أهلاً بك في نظام</h1>

    <p>إدارة المعلومات لمسجد سعد بن معاذ</p>
    <p>اضغط للدخول إلى لوحة التحكم</p>

    <a class="system-btn" href="/dashboard">الدخول إلى النظام</a>

</div>

</body>
</html>
