<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    color:white;
    position:relative;
}

/* 🌌 خلفية احترافية (نفس نظام المعلمين) */
.bg{
    position:fixed;
    inset:-20%;
    z-index:-2;
    background:
        radial-gradient(circle,#2563eb 0%,transparent 25%),
        radial-gradient(circle,#06b6d4 0%,transparent 30%),
        radial-gradient(circle,#1d4ed8 0%,transparent 25%);
    background-size:40% 40%;
    animation:bgMove 20s linear infinite;
    filter:blur(100px);
    opacity:.9;
}

@keyframes bgMove{
    0%{transform:translate(-5%,-5%) rotate(0deg);}
    50%{transform:translate(5%,5%) rotate(180deg);}
    100%{transform:translate(-5%,-5%) rotate(360deg);}
}

/* كرات ضوئية */
body::before,
body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(80px);
    z-index:-1;
}

body::before{
    background:#2563eb;
    top:-150px;
    right:-150px;
    animation:orb1 12s ease-in-out infinite;
}

body::after{
    background:#06b6d4;
    bottom:-150px;
    left:-150px;
    animation:orb2 14s ease-in-out infinite;
}

@keyframes orb1{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-150px,120px);}
}

@keyframes orb2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(150px,-120px);}
}

/* 🔥 العنوان العلوي */
.top-title{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(22px,3vw,34px);
    font-weight:800;

    background:linear-gradient(90deg,#60a5fa,#22d3ee,#3b82f6,#60a5fa);
    background-size:300% 100%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:shine 4s linear infinite;
}

@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:300%;}
}

/* 🧊 الكرت */
.card{
    position:relative;
    z-index:2;
    width:min(92%,520px);
    padding:40px;
    border-radius:26px;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 30px 80px rgba(0,0,0,0.6);

    text-align:center;

    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

/* 👋 */
.wave{
    font-size:48px;
    animation:wave 1.5s infinite;
}

@keyframes wave{
    0%{transform:rotate(0);}
    25%{transform:rotate(20deg);}
    50%{transform:rotate(-15deg);}
    75%{transform:rotate(20deg);}
    100%{transform:rotate(0);}
}

/* النصوص */
h1{
    font-size:28px;
    margin-top:10px;
}

p{
    margin-top:10px;
    color:#cbd5e1;
    font-size:16px;
}

/* الأزرار */
.buttons{
    margin-top:25px;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:12px 18px;
    border-radius:14px;
    text-decoration:none;
    font-weight:700;
    transition:0.3s;
    display:inline-block;
}

/* دخول */
.enter{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
}

.enter:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(37,99,235,0.4);
}

/* رجوع */
.back{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:white;
}

.back:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,0.15);
}

/* 📱 موبايل */
@media(max-width:600px){
    .card{
        padding:25px;
    }

    h1{font-size:22px;}
    p{font-size:14px;}

    .btn{
        width:100%;
        text-align:center;
    }
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="top-title">يا أهلاً ويا سهلاً</div>

<div class="card">

    <div class="wave">👋</div>

    <h1>مرحباً بك {{ username }}</h1>
    <p>في نظام إدارة المعلوات لمسجد سعد بن معاذ</p>

    <div class="buttons">
        <a href="/dashboard" class="btn enter">تفضل بالدخول الى النظام </a>
        <a href="/" class="btn back">العودة لتسجيل الدخول</a>
    </div>

</div>

</body>
</html>
