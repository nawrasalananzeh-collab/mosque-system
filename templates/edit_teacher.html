<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تعديل بيانات المعلم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    background:#0b1220;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    overflow:hidden;
}

/* خلفية */
.bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, #2563eb55, transparent 40%),
        radial-gradient(circle at 80% 30%, #1d4ed855, transparent 45%),
        radial-gradient(circle at 50% 80%, #0ea5e955, transparent 50%);
    filter: blur(40px);
    z-index:-1;
}

.form-box{
    width:850px; /* 🔥 صار أعرض */
    padding:28px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* عنوان */
h2{
    text-align:center;
    margin-bottom:20px;
}

/* 🔥 تحويل الفورم لشبكة */
form{
    display:grid;
    grid-template-columns: repeat(2, 1fr); /* عمودين */
    gap:12px;
}

/* كل حقل */
.input-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:12px;
    color:#93c5fd;
    margin-bottom:5px;
}

input{
    padding:10px;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,0.08);
    color:white;
}

input:focus{
    background:rgba(37,99,235,0.2);
}

/* زر الحفظ ياخذ سطر كامل */
button{
    grid-column: span 2;
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

/* رجوع */
.back{
    grid-column: span 2;
    text-align:center;
    margin-top:10px;
    color:#93c5fd;
    text-decoration:none;
}

.back:hover{
    color:white;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="form-box">

<h2>✏ تعديل بيانات المعلم</h2>

<form method="POST">

<div class="input-group">
<label>الاسم</label>
<input type="text" name="name" value="{{ teacher.name }}">
</div>

<div class="input-group">
<label>الهاتف</label>
<input type="text" name="phone" value="{{ teacher.phone }}">
</div>

<div class="input-group">
<label>العمر</label>
<input type="text" name="age" value="{{ teacher.age }}">
</div>

<div class="input-group">
<label>العنوان</label>
<input type="text" name="address" value="{{ teacher.address }}">
</div>

<div class="input-group">
<label>التخصص</label>
<input type="text" name="specialization" value="{{ teacher.specialization }}">
</div>

<div class="input-group">
<label>تاريخ الانضمام</label>
<input type="text" name="join_date" value="{{ teacher.join_date }}">
</div>

<div class="input-group">
<label>عدد الطلاب</label>
<input type="text" name="students_count" value="{{ teacher.students_count }}">
</div>

<div class="input-group">
<label>الحالة</label>
<input type="text" name="status" value="{{ teacher.status }}">
</div>

<button type="submit">💾 حفظ التعديل</button>

<a href="/teachers" class="back">⬅ رجوع</a>

</form>

</div>
<script src="/static/transition.js"></script>
</body>
</html>
