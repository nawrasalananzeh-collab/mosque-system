<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ملف الختمة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{font-family:Cairo;background:#f5f7fa;margin:0}
.container{width:90%;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px}
.boxes{display:flex;gap:10px;flex-wrap:wrap}
.box{flex:1;background:#eef2f7;padding:15px;border-radius:10px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:center}
.badge{padding:5px 10px;border-radius:8px;color:white}
.active{background:green}
</style>

</head>

<body>

<div class="container">

<a href="/khatmat">⬅ رجوع</a>

<div class="card">
    <h2>📘 {{ khatma['student_name'] }}</h2>

    <div class="boxes">
        <div class="box">📅 {{ khatma['khatma_date'] }}</div>
        <div class="box">📍 {{ khatma['khatma_place'] }}</div>
        <div class="box">🕌 {{ khatma['mosque_name'] }}</div>
        <div class="box">👨‍🏫 {{ khatma['sheikh_name'] }}</div>
    </div>
</div>

<div class="card">
    <h3>👨‍🎓 الطلاب</h3>

    <table>
        <tr>
            <th>الاسم</th>
        </tr>

        {% for s in students %}
        <tr>
            <td>{{ s['student_name'] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

</div>

</body>
</html>
