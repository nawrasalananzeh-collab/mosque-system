<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة ختمة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;

    background:
        radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
        radial-gradient(circle at 80% 30%, #2563eb, transparent 45%),
        radial-gradient(circle at 50% 80%, #0f172a, #020617);

    background-size:200% 200%;
    animation:bgMove 10s ease-in-out infinite;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.box{
    width:100%;
    max-width:1200px;

    background:rgba(255,255,255,.06);
    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:25px;

    padding:35px;

    box-shadow:0 25px 60px rgba(0,0,0,.45);

    color:white;
}

.title{
    text-align:center;
    font-size:32px;
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:6px;
    font-weight:bold;
}

input,
select{
    padding:12px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.10);
    color:white;
    outline:none;
}

option{
    color:black;
}

.full{
    grid-column:1 / -1;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:25px;
}

.btn{
    flex:1;
    text-decoration:none;
    text-align:center;

    padding:14px;

    border:none;
    border-radius:12px;

    cursor:pointer;

    color:white;
    font-size:16px;
    font-weight:bold;

    transition:.3s;
}

.save{
    background:#2563eb;
}

.save:hover{
    background:#1d4ed8;
}

.back{
    background:#475569;
}

.back:hover{
    background:#334155;
}
</style>
</head>

<body>

<div class="box">

<h2 class="title">🕋 إضافة ختمة جديدة</h2>

<form method="POST" enctype="multipart/form-data">

<div class="form-grid">

<div class="input-group">
<label>اسم الطالب</label>
<input type="text" name="student_name" required>
</div>

<div class="input-group">
<label>اسم الشيخ</label>
<input type="text" name="sheikh_name">
</div>

<div class="input-group">
<label>تاريخ الختمة</label>
<input type="date" name="khatma_date">
</div>

<div class="input-group">
<label>مكان الختمة</label>
<input type="text" name="khatma_place">
</div>

<div class="input-group">
<label>اسم المسجد</label>
<input type="text" name="mosque_name">
</div>

<div class="input-group">
<label>العمر عند الختمة</label>
<input type="number" name="age">
</div>

<div class="input-group">
<label>المدينة</label>
<input type="text" name="city">
</div>

<div class="input-group">
<label>الدولة</label>
<input type="text" name="country">
</div>

<div class="input-group">
<label>التقدير</label>
<select name="grade">
<option value="">اختر</option>
<option>ممتاز</option>
<option>جيد جداً</option>
<option>جيد</option>
<option>مقبول</option>
</select>
</div>

<div class="input-group">
<label>نوع الختمة</label>
<input type="text" name="khatma_type" placeholder="حفص / ورش">
</div>

<div class="input-group">
<label>عدد الحضور</label>
<input type="number" name="attendance_count">
</div>

<div class="input-group">
<label>صورة شهادة الختمة</label>
<input type="file" name="certificate_image" accept="image/*">
</div>

<div class="input-group">
<label>صورة الطالب</label>
<input type="file" name="student_image" accept="image/*">
</div>

<div class="input-group">
<label>فيديو الختمة</label>
<input type="file" name="video_file" accept="video/*">
</div>

<div class="input-group">
<label>ملف PDF للشهادة</label>
<input type="file" name="pdf_file" accept=".pdf">
</div>

</div>

<div class="buttons">

<button type="submit" class="btn save">
💾 حفظ الختمة
</button>

<a href="/khatmat" class="btn back">
⬅ رجوع
</a>

</div>

</form>

</div>

</body>
</html>
