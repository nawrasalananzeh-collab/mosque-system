<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة ختمة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#050816;
    color:white;
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

input,select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    color:white;
}

input::placeholder{
    color:#cbd5e1;
}

.btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:white;
    text-decoration:none;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>🕋 إضافة ختمة جديدة</h1>

        <form method="POST">

            <div class="grid">

                <input type="text" name="student_name" placeholder="اسم الطالب" required>

                <input type="date" name="khatma_date" required>

                <input type="text" name="khatma_place" placeholder="مكان الختمة">

                <input type="text" name="sheikh_name" placeholder="اسم الشيخ">

                <input type="text" name="mosque_name" placeholder="اسم المسجد">

                <input type="text" name="city" placeholder="المدينة">

                <input type="text" name="country" placeholder="الدولة">

                <input type="number" name="age" placeholder="العمر">

                <input type="text" name="grade" placeholder="الصف الدراسي">

                <input type="text" name="khatma_type" placeholder="نوع الختمة">

                <input type="number" name="attendance_count" placeholder="عدد أيام الحضور">

            </div>

            <button type="submit" class="btn">
                💾 حفظ الختمة
            </button>

        </form>

    </div>

    <a href="/khatmat" class="back">
        ← العودة للختمات
    </a>

</div>

</body>
</html>
